name: Build APK from ZIP

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Extract bubble-grid-arcade.zip
        run: |
          mkdir -p extracted_src
          unzip -q bubble-grid-arcade.zip -d extracted_src

      - name: Generate debug.keystore & Build APK
        run: |
          GRADLE_DIR=$(find extracted_src -name "build.gradle.kts" -o -name "build.gradle" | head -n 1 | xargs dirname)
          cd "$GRADLE_DIR"

          if [ ! -f debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew assembleDebug || { cat app/build.gradle.kts; exit 1; }
          else
            gradle assembleDebug || { cat app/build.gradle.kts; exit 1; }
          fi

      - name: Upload built APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: extracted_src/**/app/build/outputs/apk/debug/*.apk
